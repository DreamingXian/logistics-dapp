<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decentralized Escrow & Logistics Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.10.0/web3.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
        <span class="fs-4 me-2">🚢</span> Logistics Escrow dApp
      </a>
      <div class="d-flex align-items-center gap-2">
        <button id="connectWalletBtn" class="btn btn-primary px-4" onclick="App.connectWallet()">Connect MetaMask</button>
        <span id="accountBadge" class="badge bg-secondary d-none py-2 px-3"></span>
        <span id="roleBadge" class="badge bg-info text-dark d-none py-2 px-3"></span>
        <span id="reputationBadge" class="badge bg-warning text-dark d-none py-2 px-3"></span>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div id="registrationPanel" class="glass-card p-4 mb-4 d-none">
      <h4 class="fw-bold mb-3 text-primary">📝 Register User Profile</h4>
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label">Full Name / Company Name</label>
          <input type="text" id="regName" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Acme Corp">
        </div>
        <div class="col-md-4">
          <label class="form-label">Role Designation</label>
          <select id="regRole" class="form-select bg-dark text-white border-secondary">
            <option value="1">Shipper (Cargo Owner / Buyer)</option>
            <option value="2">Carrier (Transporter / Logistics)</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-success w-100 py-2 fw-semibold" onclick="App.registerUser()">Register</button>
        </div>
      </div>
    </div>

    <div id="shipperCreatePanel" class="glass-card p-4 mb-4 d-none">
      <h4 class="fw-bold mb-3 text-primary">📦 Create Freight Agreement & Fund Escrow</h4>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Carrier Address</label>
          <input type="text" id="createCarrierAddr" class="form-control bg-dark text-white border-secondary" placeholder="0x...">
        </div>
        <div class="col-md-2">
          <label class="form-label">Distance (km)</label>
          <input type="number" id="calcDistance" class="form-control bg-dark text-white border-secondary" value="50" oninput="App.calculateEstimate()">
        </div>
        <div class="col-md-2">
          <label class="form-label">Weight (kg)</label>
          <input type="number" id="calcWeight" class="form-control bg-dark text-white border-secondary" value="20" oninput="App.calculateEstimate()">
        </div>
        <div class="col-md-2">
          <label class="form-label">Payload (ETH)</label>
          <input type="number" step="0.001" id="createEthValue" class="form-control bg-dark text-white border-secondary" placeholder="0.05">
        </div>
        <div class="col-md-2">
          <label class="form-label">Deadline (Mins)</label>
          <input type="number" id="createDeadlineMinutes" class="form-control bg-dark text-white border-secondary" value="10">
        </div>
        <div class="col-12 text-end">
          <button class="btn btn-primary px-4 py-2 fw-semibold" onclick="App.createAgreement()">Deposit & Create Agreement</button>
        </div>
      </div>
    </div>

    <div class="glass-card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0 text-white">📊 Public Scannable Agreement Ledger</h4>
        <button class="btn btn-sm btn-outline-light" onclick="App.loadAgreements()">🔄 Refresh Table</button>
      </div>
      <div class="table-responsive">
        <table class="table table-dark-custom align-middle">
          <thead>
            <tr class="text-secondary">
              <th>ID</th>
              <th>Shipper</th>
              <th>Carrier</th>
              <th>Total ETH</th>
              <th>Remaining Escrow</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="agreementTableBody">
            <tr><td colspan="8" class="text-center text-muted py-4">Connect MetaMask wallet to load agreements</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
